# Local development stack. `minio` runs only with `--profile dev`.
x-app: &app
  build: .
  environment: &app-env
    ENV: development
    DATABASE_URL: postgresql+psycopg://africasignal:africasignal@db:5432/africasignal
    S3_ENDPOINT_URL: http://minio:9000
    S3_BUCKET: africasignal
    S3_ACCESS_KEY_ID: minioadmin
    S3_SECRET_ACCESS_KEY: minioadmin
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: africasignal
      POSTGRES_PASSWORD: africasignal
      POSTGRES_DB: africasignal
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U africasignal"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "africasignal.jobs.worker"]
    stop_grace_period: 60s

  scheduler:
    <<: *app
    command: ["python", "-m", "africasignal.jobs.scheduler"]

  minio:
    image: minio/minio
    profiles: ["dev"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  dbdata:
  miniodata:
