name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: africasignal
          POSTGRES_PASSWORD: africasignal
          POSTGRES_DB: africasignal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U africasignal"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://africasignal:africasignal@localhost:5432/africasignal_test
      DATABASE_URL: postgresql+psycopg://africasignal:africasignal@localhost:5432/africasignal_test
      RUN_NETWORK_TESTS: "1"  # downloads the real boundary files (see tests/integration/test_places_full.py)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v5
        with:
          path: data/places
          key: places-boundaries-v1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl tesseract-ocr
          curl -fsSL https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip -o /tmp/rclone.zip
          echo '982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  /tmp/rclone.zip' | sha256sum -c -
          python -c "import pathlib, zipfile; z=zipfile.ZipFile('/tmp/rclone.zip'); n=next(x for x in z.namelist() if x.endswith('/rclone')); pathlib.Path('/tmp/rclone').write_bytes(z.read(n))"
          sudo install -m 0755 /tmp/rclone /usr/local/bin/rclone
          rm /tmp/rclone /tmp/rclone.zip
      - run: pip install pip==26.2.1 setuptools==84.0.0 wheel==0.48.0
      - run: pip install -r requirements-dev.lock && pip install --no-deps --no-build-isolation -e ".[dev]"
      - run: pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
      # A real drill on the real schema: migrate, seed, back up, restore into a scratch database, compare.
      - name: Restore drill
        run: |
          alembic upgrade head
          python -m africasignal.sources.seed
          BACKUP_DIR="$RUNNER_TEMP/drill-backups" OPS_USE_CONSOLE_SETTINGS=0 scripts/restore-drill.sh
      - run: pip-audit
      - name: Build production images
        run: |
          docker build -t africasignal:ci .
          docker build -f docker/backup/Dockerfile -t africasignal-backup:ci .
