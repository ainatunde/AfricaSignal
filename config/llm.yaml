# Language-model routes and reviewed prices (USD per million input/output tokens).
# Provider model IDs and prices were checked against official API docs on 2026-10-02:
# https://developers.openai.com/api/docs/models/gpt-5.4-mini
# https://platform.claude.com/docs/en/about-claude/pricing
#
# Values are configured here, not estimated at runtime. A model without a price is refused.

default_provider: anthropic
default_model: claude-sonnet-5-5

purposes:
  claim_extract: {provider: anthropic, model: claude-sonnet-5-5, effort: low}
  explain: {provider: anthropic, model: claude-sonnet-5-5, effort: low}

prices:
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-opus-5-5: {input: 4.00, output: 20.00}
  claude-haiku-4-5: {input: 1.00, output: 5.00}
  openai/gpt-5.4-mini: {input: 0.75, output: 4.50}
