# Tracked items, units, materiality thresholds and possible price drivers (spec B6.3, B6.8, B8.2).
#
# The `nbs` mapping of every item was checked against real NBS files (see tests/fixtures/nbs/,
# manifest.json). What the files actually look like, which differs from the plan's assumptions:
#   - Fuel and gas publications (pms, ago, dpk, lpg) are state tables: one row per state plus a
#     national row, columns for the same month last year, the previous month and the reference
#     month. A publication can hold several blocks (lpg: 5kg and 12.5kg; dpk: litre and gallon),
#     so an item names a publication and a block, not a row label.
#   - The food workbook has NATIONAL averages only, one row per item (the state grid is not in
#     the file; only the highest and lowest state are named as text). Food items therefore name
#     the exact row label.
# Units: NBS states the unit in its summary text for petrol, diesel, kerosene, cooking gas and for
# the beans and local rice rows ("1kg ... sold loose"). The garri and maize rows say "sold loose"
# only; NGN/kg is presumed for them (`unit_confirmed: false`) and should be checked before those
# two items are shown to the public.
# Materiality defaults to |month-on-month| >= 5 % or |year-on-year| >= 20 %.

# How each NBS publication is found in the eLibrary listing (title) and read (layout).
nbs_publications:
  - {code: pms,  layout: state_table, title_pattern: '^Premium Motor Spirit \(Petrol\) Price Watch'}
  - {code: ago,  layout: zoned_table, title_pattern: '^Automotive Gas Oil \(Diesel\) Price Watch'}
  - {code: dpk,  layout: two_blocks,  title_pattern: '^(National )?Household Kerosene Price Watch'}
  - {code: lpg,  layout: two_blocks,  title_pattern: '^Liquefied Petroleum Gas \(Cooking Gas\) Price Watch'}
  - {code: food, layout: national_items, title_pattern: '^Selected Food Prices? Watch'}

keywords:
  energy: [petrol, PMS, fuel price, pump price, diesel, AGO, kerosene, DPK, cooking gas, LPG,
           electricity tariff, Band A, NERC, DisCo, prepaid meter, NMDPRA, NNPC, subsidy]
  food: [food price, foodstuff, rice, garri, beans, yam, maize, tomato, bread, vegetable oil,
         food inflation, market prices]

items:
  - code: pms_litre
    label: petrol (PMS)
    topic: energy
    unit: NGN/litre
    nbs: {publication: pms}
    factors:
      - {code: crude_price, label: Crude oil price, keywords: ["crude oil", "crude price", "brent"]}
      - {code: exchange_rate, label: Exchange rate, keywords: ["exchange rate", "naira", "forex", "dollar"]}
      - {code: supply_disruption, label: Supply disruption, keywords: ["supply", "depot", "scarcity", "queue", "strike"]}
      - {code: regulatory_price_change, label: Regulatory price change, keywords: ["NMDPRA", "price cap", "subsidy", "ex-depot", "deregulation"]}

  - code: ago_litre
    label: diesel (AGO)
    topic: energy
    unit: NGN/litre
    nbs: {publication: ago}
    factors:
      - {code: crude_price, label: Crude oil price, keywords: ["crude oil", "crude price", "brent"]}
      - {code: exchange_rate, label: Exchange rate, keywords: ["exchange rate", "naira", "forex", "dollar"]}
      - {code: supply_disruption, label: Supply disruption, keywords: ["supply", "depot", "scarcity", "strike"]}

  - code: dpk_litre
    label: household kerosene (DPK)
    topic: energy
    unit: NGN/litre
    nbs: {publication: dpk, block: LITRE}
    factors:
      - {code: crude_price, label: Crude oil price, keywords: ["crude oil", "crude price", "brent"]}
      - {code: supply_disruption, label: Supply disruption, keywords: ["supply", "scarcity", "depot"]}

  - code: lpg_5kg
    label: cooking gas (5 kg refill)
    topic: energy
    unit: NGN/5kg
    nbs: {publication: lpg, block: 5KG}
    factors:
      - {code: exchange_rate, label: Exchange rate, keywords: ["exchange rate", "naira", "forex", "dollar"]}
      - {code: import_supply, label: Import and supply, keywords: ["import", "vessel", "supply", "scarcity"]}

  - code: lpg_12_5kg
    label: cooking gas (12.5 kg refill)
    topic: energy
    unit: NGN/12.5kg
    nbs: {publication: lpg, block: 12.5KG}
    factors:
      - {code: exchange_rate, label: Exchange rate, keywords: ["exchange rate", "naira", "forex", "dollar"]}
      - {code: import_supply, label: Import and supply, keywords: ["import", "vessel", "supply", "scarcity"]}

  - code: rice_local_1kg
    label: local rice (1 kg)
    topic: food
    unit: NGN/kg
    nbs: {publication: food, labels: ["Rice local sold loose"]}
    factors:
      - {code: transport_costs, label: Transport costs, keywords: ["transport", "fuel price", "haulage"]}
      - {code: import_policy, label: Import policy, keywords: ["import duty", "import ban", "tariff", "border"]}
      - {code: insecurity, label: Insecurity affecting farming, keywords: ["insecurity", "banditry", "farmers"]}

  - code: garri_white_1kg
    label: white garri (1 kg)
    topic: food
    unit: NGN/kg
    nbs: {publication: food, labels: ["Gari white,sold loose"], unit_confirmed: false}
    factors:
      - {code: transport_costs, label: Transport costs, keywords: ["transport", "fuel price", "haulage"]}
      - {code: insecurity, label: Insecurity affecting farming, keywords: ["insecurity", "banditry", "farmers"]}

  - code: beans_brown_1kg
    label: brown beans (1 kg)
    topic: food
    unit: NGN/kg
    nbs: {publication: food, labels: ["Beans brown,sold loose"]}
    factors:
      - {code: transport_costs, label: Transport costs, keywords: ["transport", "fuel price", "haulage"]}
      - {code: season, label: Harvest and season, keywords: ["harvest", "lean season", "rainfall", "flood"]}

  - code: maize_white_1kg
    label: white maize grain (1 kg)
    topic: food
    unit: NGN/kg
    nbs: {publication: food, labels: ["Maize grain white sold loose"], unit_confirmed: false}
    factors:
      - {code: season, label: Harvest and season, keywords: ["harvest", "lean season", "rainfall", "flood"]}
      - {code: insecurity, label: Insecurity affecting farming, keywords: ["insecurity", "banditry", "farmers"]}
