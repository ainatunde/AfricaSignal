# Source registry seed, loaded by `python -m africasignal.sources.seed` (idempotent upsert by slug).
#
# STATUS: the home pages below are the ones named in the implementation plan. None of these hosts
# was reachable from the environment this file was written in, so no URL, feed or terms page has
# been verified. Each `# verify` marks something to check against the live site (and its robots.txt
# and terms) before an operator approves the source. News feeds are left empty and the sources
# inactive until a working feed URL is confirmed.
#
# Permissions seeded here are created UNAPPROVED (version 1). An operator approves each one in the
# console (AS-022) before the first fetch. Re-running the seed never touches an existing
# permission, an operator's `active` switch or a source's schedule state.

- slug: nbs-elibrary
  name: National Bureau of Statistics (eLibrary)
  kind: official_statistics
  adapter: nbs
  owner: National Bureau of Statistics
  # Verified 2026-09-30: the page is one HTML table of every NBS release (1695 rows); each price
  # watch links to a report page whose "Download Tables" link is the Excel file. robots.txt
  # does not exist (404). NBS terms of use were NOT reviewed: an operator must do that before
  # approving the permission. On that date the newest price watch listed was October 2024.
  home_url: https://nigerianstat.gov.ng/elibrary
  schedule_minutes: 1440
  max_requests_per_hour: 30
  coverage_note: Monthly price-watch publications (food, PMS, AGO, DPK, LPG), state by state.
  permission:
    may_collect: true
    may_store_full_text: true
    max_quote_chars: null
    may_republish_numbers: true
    rights_basis: "Public government statistics, attributed"

