# Source registry seed, loaded by `python -m africasignal.sources.seed` (idempotent upsert by slug).
#
# STATUS: the home pages below are the ones named in the implementation plan. None of these hosts
# was reachable from the environment this file was written in, so no URL, feed or terms page has
# been verified. Each `# verify` marks something to check against the live site (and its robots.txt
# and terms) before an operator approves the source. News feeds are left empty and the sources
# inactive until a working feed URL is confirmed.
#
# Permissions seeded here are created UNAPPROVED (version 1). An operator approves each one in the
# console (AS-022) before the first fetch. Re-running the seed never touches an existing
# permission, an operator's `active` switch or a source's schedule state.

- slug: nbs-elibrary
  name: National Bureau of Statistics (eLibrary)
  kind: official_statistics
  adapter: nbs
  owner: National Bureau of Statistics
  # Verified 2026-09-30: the page is one HTML table of every NBS release (1695 rows); each price
  # watch links to a report page whose "Download Tables" link is the Excel file. robots.txt
  # does not exist (404). NBS terms of use were NOT reviewed: an operator must do that before
  # approving the permission. On that date the newest price watch listed was October 2024.
  home_url: https://nigerianstat.gov.ng/elibrary
  schedule_minutes: 1440
  max_requests_per_hour: 30
  coverage_note: Monthly price-watch publications (food, PMS, AGO, DPK, LPG), state by state.
  permission:
    may_collect: true
    may_store_full_text: true
    max_quote_chars: null
    may_republish_numbers: true
    rights_basis: "Public government statistics, attributed"

- slug: nbs-microdata
  name: National Bureau of Statistics (microdata catalog)
  kind: official_statistics
  adapter: nbs
  owner: National Bureau of Statistics
  # Verified 2026-09-30: the price watches from 2025 on are published here, not on the eLibrary
  # page. Each publication has a catalog page (ids in config/items.yaml) listing downloads, newest
  # first; a download is a ZIP holding a PDF report and an xlsx table. The newest release then was
  # May 2026 (April 2026 for cooking gas). robots.txt does not exist (404). Terms of use were NOT
  # reviewed: an operator must do that before approving the permission.
  home_url: https://microdata.nigerianstat.gov.ng/index.php/catalog
  schedule_minutes: 1440
  max_requests_per_hour: 30
  coverage_note: Monthly price-watch publications (food, PMS, AGO, DPK, LPG) from 2025 on.
  permission:
    may_collect: true
    may_store_full_text: true
    max_quote_chars: null
    may_republish_numbers: true
    rights_basis: "Public government statistics, attributed"

- slug: nerc
  name: Nigerian Electricity Regulatory Commission
  kind: regulator
  adapter: nerc
  owner: Nigerian Electricity Regulatory Commission
  # Verified 2026-09-30: orders are listed at feed_url (57 pages, newest first), each entry with a PDF.
  # The monthly DisCo tariff schedules ("IE MYTO SEPTEMBER 2026") are PDFs with no text layer, so
  # pdfplumber cannot read the tariffs: OCR is needed. Plain orders do have text. robots.txt only
  # disallows /wp-admin/. No terms page found. See tests/fixtures/nerc/manifest.json.
  home_url: https://nerc.gov.ng
  feed_url: https://nerc.gov.ng/resource-category/orders/
  schedule_minutes: 360
  max_requests_per_hour: 30
  coverage_note: Tariff orders and supplementary orders.
  permission:
    may_collect: true
    may_store_full_text: true
    max_quote_chars: null
    may_republish_numbers: true
    rights_basis: "Public regulator documents, attributed"

- slug: nmdpra
  name: Nigerian Midstream and Downstream Petroleum Regulatory Authority
  kind: regulator
  adapter: price_announcement
  owner: NMDPRA
  # Verified 2026-09-30: the site is a Blazor WebAssembly app; its pages carry no content without
  # running JavaScript, so this source cannot be read by the static adapters of release 1.
  # The API behind it needs a Microsoft Entra ID sign-in, so it is not used. NMDPRA's monthly
  # sector fact sheets (cooking gas prices by city) are reported by the press; their own URL was
  # not found. Inactive until a route is found. See tests/fixtures/nmdpra/manifest.json.
  home_url: https://nmdpra.gov.ng
  active: false
  schedule_minutes: 360
  max_requests_per_hour: 30
  coverage_note: Price and policy announcements for petroleum products.
  permission:
    may_collect: true
    may_store_full_text: true
    max_quote_chars: null
    may_republish_numbers: true
    rights_basis: "Public regulator announcements, attributed"

- slug: nnpc
  name: NNPC Limited
  kind: company
  adapter: price_announcement
  owner: NNPC Limited
  # Verified 2026-09-30: /insights is filled in by the browser from the CMS API in feed_url (Strapi
  # JSON; ?sort=publishedAt:desc&pagination[pageSize]=10 gives the newest). The 10 newest posts are
  # corporate press releases and reports with no fuel price announcements. Terms allow personal,
  # non-commercial use only. See tests/fixtures/nnpc/manifest.json.
  home_url: https://nnpcgroup.com
  feed_url: https://fde-nnpc-web-cms-prod-dwfrd0hraahrbhhg.a02.azurefd.net/api/posts
  schedule_minutes: 360
  max_requests_per_hour: 30
  coverage_note: Company price announcements and press releases.
  permission:
    may_collect: true
    may_store_full_text: false
    max_quote_chars: 300
    may_republish_numbers: true
    rights_basis: "Company announcements: link and short quotation"

- slug: gdelt
  name: GDELT 2.0 Events and Mentions
  kind: aggregator
  adapter: gdelt
  owner: The GDELT Project
  home_url: https://www.gdeltproject.org
  # Verified 2026-09-30: the http:// URL redirects (301) to https://, and lastupdate.txt itself still
  # lists http:// file URLs that redirect the same way. Use https. No robots.txt (404). Terms: open
  # for any use with a citation of the GDELT Project (see tests/fixtures/gdelt/manifest.json).
  feed_url: https://data.gdeltproject.org/gdeltv2/lastupdate.txt
  schedule_minutes: 15
  max_requests_per_hour: 30
  coverage_note: Used to discover news URLs only; never shown as evidence itself. Polled by the gdelt_poll job, not fetch_source.
  permission:
    may_collect: true
    may_store_full_text: false
    max_quote_chars: 0
    may_republish_numbers: false
    rights_basis: "GDELT is open with citation; only URLs and event metadata are used"

