- slug: gdelt
  name: GDELT 2.0 Events and Mentions
  kind: aggregator
  adapter: gdelt
  owner: The GDELT Project
  home_url: https://www.gdeltproject.org
  feed_url: http://data.gdeltproject.org/gdeltv2/lastupdate.txt
  schedule_minutes: 15
  max_requests_per_hour: 30
  coverage_note: Used to discover news URLs only; never shown as evidence itself. Polled by the gdelt_poll job, not fetch_source.
  permission:
    may_collect: true
    may_store_full_text: false
    max_quote_chars: 0
    may_republish_numbers: false
    rights_basis: "GDELT is open with citation; only URLs and event metadata are used"

