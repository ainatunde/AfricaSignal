{% extends "admin/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post" action="/admin/login" autocomplete="off">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autocomplete="username" maxlength="320">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required autocomplete="current-password" maxlength="1024">
  <label for="code">Authenticator code (6 digits)</label>
  <input id="code" name="code" type="text" required inputmode="numeric" pattern="[0-9 ]{6,7}" autocomplete="one-time-code" maxlength="16">
  <p><button type="submit">Sign in</button></p>
</form>
{% endblock %}
