{% extends "base.html" %}
{% block title %}Confirm sign in · AfricaSignal{% endblock %}
{% block head %}<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">{% endblock %}
{% block content %}
<h1>Sign in to AfricaSignal</h1>
<p class="lead">Press the button to finish signing in on this device.</p>
<form method="post" action="/signin/verify" class="form">
  <input type="hidden" name="token" value="{{ token }}">
  <button type="submit">Sign in</button>
</form>
{% endblock %}
