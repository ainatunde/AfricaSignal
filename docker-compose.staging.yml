# Controlled staging only. No database or object-store service is created here.
# See docs/staging-deployment-plan.md before using this file.
x-runtime-environment: &runtime-environment
  ENV: staging
  DATABASE_URL: ${DATABASE_URL:?set the staging runtime database URL}
  SECRET_KEY: ${SECRET_KEY:?inject a unique staging secret}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set the HTTPS staging origin}
  STAGING_EMAIL_ALLOWED_RECIPIENTS: ${STAGING_EMAIL_ALLOWED_RECIPIENTS:?set comma-separated test-only addresses}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?set the staging object-store endpoint}
  S3_BUCKET: ${S3_BUCKET:?set the staging application bucket}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set staging application storage credentials}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set staging application storage credentials}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-1}
  LLM_PER_JOB_MAX_TOKENS: ${LLM_PER_JOB_MAX_TOKENS:-20000}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
  EMAIL_API_KEY: ${EMAIL_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  WORKER_HEARTBEAT_URL: ${WORKER_HEARTBEAT_URL:-}
  SCHEDULER_HEARTBEAT_URL: ${SCHEDULER_HEARTBEAT_URL:-}

services:
  migrate:
    image: ${AFRICASIGNAL_IMAGE:?set an immutable app image digest}
    environment:
      <<: *runtime-environment
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?set a staging-only migration-owner database URL}
    command:
      - sh
      - -c
      - alembic upgrade head && python -m africasignal.sources.seed && python -m africasignal.staging
    restart: "no"

  web:
    image: ${AFRICASIGNAL_IMAGE:?set an immutable app image digest}
    environment: *runtime-environment
    command:
      - uvicorn
      - africasignal.web.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --no-proxy-headers
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: ${AFRICASIGNAL_IMAGE:?set an immutable app image digest}
    environment: *runtime-environment
    command: ["python", "-m", "africasignal.jobs.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 6m

  scheduler:
    image: ${AFRICASIGNAL_IMAGE:?set an immutable app image digest}
    environment: *runtime-environment
    command: ["python", "-m", "africasignal.jobs.scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  backup:
    image: ${AFRICASIGNAL_BACKUP_IMAGE:?set an immutable backup image digest}
    profiles: ["backup"]
    environment:
      ENV: staging
      DATABASE_URL: ${DATABASE_URL:?set the staging runtime database URL}
      SECRET_KEY: ${SECRET_KEY:?inject the staging secret}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?set the staging object-store endpoint}
      S3_BUCKET: ${S3_BUCKET:?set the staging application bucket}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set staging application storage credentials}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set staging application storage credentials}
      BACKUP_S3_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT_URL:?set a separate backup endpoint}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?set a separate backup bucket}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?set backup-only credentials}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?set backup-only credentials}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-africasignal/staging}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-30}
      BACKUP_PASSPHRASE_FILE: /run/secrets/staging_backup_passphrase
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      BACKUP_AT_UTC: ${BACKUP_AT_UTC:-02:30}
    restart: unless-stopped
    secrets:
      - staging_backup_passphrase
    depends_on:
      migrate:
        condition: service_completed_successfully

secrets:
  staging_backup_passphrase:
    file: ${BACKUP_PASSPHRASE_FILE:?set a protected host path for the staging backup passphrase}
